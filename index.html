<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CECyTEM Neza II</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="hoja">

  <!-- MENÚ ARRIBA -->
  <div class="menu">
    <div class="menu-izq">
      <label>Nombre: <input type="text"></label>
      <label>Carrera: <input type="text"></label>
    </div>
    <a href="#formulario" class="btn-form">Formulario de 5 preguntas</a>
    <div class="menu-der">
      <span>Día</span><span>Mes</span><span>Año</span>
      <span class="folio">Folio</span>
    </div>
  </div>

  <!-- TUS 3 IMÁGENES -->
  <div class="galeria">
    <img src="./img/cecy.jpg" alt="Imagen 1">
    <img src="./img/cecy2.jpg" alt="Imagen 2">
    <img src="./img/grinch.jpg" alt="Imagen 3">
  </div>

  <!-- MAPA CECYTEM NEZA DOS -->
  <div class="mapa">
    <h3>Mapa donde se encuentra el CECyTEM Neza II</h3>
    <p>Nezahualcóyotl, Estado de México</p>
    <iframe 
      src="https://www.google.com/maps?q=CECyTEM+Nezahualcoyotl+II&output=embed"
      loading="lazy">
    </iframe>
  </div>

  <!-- FORMULARIO 5 PREGUNTAS FIJAS -->
  <div class="formulario" id="formulario">
    <h3>Formulario de 5 preguntas</h3>

    <label>1. ¿Cuál es tu nombre completo?</label>
    <input type="text">

    <label>2. ¿Qué carrera estudias en el CECyTEM Neza II?</label>
    <input type="text">

    <label>3. ¿En qué grupo y turno vas?</label>
    <input type="text">

    <label>4. ¿En qué colonia vives y cómo llegas al CECyTEM Neza II?</label>
    <input type="text">

    <label>5. ¿Qué es lo que más te gusta de tu escuela?</label>
    <input type="text">

    <button>Enviar</button>
  </div>

</div>

<script src="js/scripts.js"></script>
</body>
</html>
